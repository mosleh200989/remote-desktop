# Copy to /etc/nginx/sites-available/remote-desktop.conf on your VPS,
# symlink into sites-enabled, then run certbot (see README) which will edit
# the TLS lines in automatically. Replace remote.your-domain.example.com and
# the web-controller root path with your own.

server {
    listen 80;
    server_name remote.your-domain.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name remote.your-domain.example.com;

    ssl_certificate     /etc/letsencrypt/live/remote.your-domain.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/remote.your-domain.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Built web-controller (npm run build output in web-controller/dist).
    root /var/www/remote-desktop/web-controller-dist;
    index index.html;
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s; # keep long-lived signaling sockets open
    }
}
